<!DOCTYPE html>
<html lang="en" class="h-full" data-theme="{{ theme | default(default_ui_theme) }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <!-- Favicon: the chat header's logo mark, inlined as a data URI (no image asset). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230954cc'/%3E%3Cpath d='M9 11h14M12.5 11v8.5c0 1-1 1-1 1M19.5 11v6c0 2 1.2 2.4 2.6 3.1.5.25.5.95-.1 1.05' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">


  <!-- Tailwind's browser build (the script cdn.tailwindcss.com serves), vendored locally so the app has no third-party network dependency (see "Vendored frontend libraries" in README.md). It compiles utility classes client-side via a MutationObserver, so no Node build step. -->
  <script src="/static/vendor/tailwindcss/tailwind.js"></script>
  <script>
    // Every family is remapped to a CSS custom property (app/static/css/themes.css) instead of a fixed hex scale:
    // Tailwind's JIT emits each utility's rule once, referencing the active [data-theme="..."] vars, so swapping <html
    // data-theme> is a repaint, not a re-scan. `<alpha-value>` keeps opacity modifiers like bg-slate-900/50 working.
    function themedColorScale(name) {
      const scale = {};
      for (const shade of [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950]) {
        scale[shade] = `rgb(var(--color-${name}-${shade}) / <alpha-value>)`;
      }
      return scale;
    }
    // The warning/notice accent (every `*-warning-*` class). Pick a ramp from app/static/css/themes.css: 'warn-pink',
    // 'warn-purple' or 'warn-red'. To add a colour, add a `--color-warn-<name>-50..950` ramp to themes.css in BOTH
    // semantic blocks (dark as-is, light with shades reversed, like the amber/red ramps), then name it here.
    const WARNING_RAMP = 'warn-red';
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: themedColorScale('slate'),
            brand: themedColorScale('brand'),
            amber: themedColorScale('amber'),
            warning: themedColorScale(WARNING_RAMP),
            red: themedColorScale('red'),
            rose: themedColorScale('rose'),
            emerald: themedColorScale('emerald'),
          },
        },
      },
    };
  </script>

  <!-- marked.js: renders the model's markdown replies as HTML. -->
  <script src="/static/vendor/marked/marked.min.js"></script>
  <!-- DOMPurify: sanitizes marked's HTML before innerHTML; marked does not sanitize, so raw HTML/event handlers in message content would otherwise run. -->
  <script src="/static/vendor/dompurify/purify.min.js"></script>
  <!-- highlight.js: highlights fenced code in replies with one fixed color scheme (app.theme_config.HLJS_THEME), not a per-user setting like the UI theme below. -->
  <link rel="stylesheet" href="/static/vendor/highlightjs/styles/{{ hljs_theme }}.min.css">
  <script src="/static/vendor/highlightjs/highlight.min.js"></script>
  <!-- KaTeX: renders LaTeX math in a reply (\[...\]/\(...\)/$$...$$; see chat.js extractMathSpans, which explains why bare $...$ is unsupported) as typeset math. Extracted and rendered before marked.parse, because CommonMark's backslash-escape rule (before any ASCII punctuation, including \( \), \[, \]) would strip the delimiters math relies on. -->
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <script src="/static/vendor/katex/katex.min.js"></script>

  <!-- Preloaded on every page (not only with a Nunito theme) so the first live preview of "Sunshine"/"Bubblegum" in Settings shows no fallback-font flash. -->
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/nunito/Nunito-Variable-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/static/vendor/fonts/nunito/Nunito-Variable-latin-ext.woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/themes.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/css/style.css?v={{ static_version }}">
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased" data-app-name="{{ app_name }}" data-is-admin="{{ 'true' if is_admin else 'false' }}" data-user-id="{{ user_id or '' }}" data-username="{{ username or '' }}" data-first-name="{{ first_name or '' }}" data-last-name="{{ last_name or '' }}" data-avatar-url="{{ avatar_url or '' }}" data-timezone="{{ timezone or 'UTC' }}">
  {% block body %}{% endblock %}
</body>
</html>
