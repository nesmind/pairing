<!-- Settings > System > MCP tools: the on/off switch for everyone, and the limits every MCP server shares.
     Wired by app/static/js/settings_mcp_servers.js to /api/settings/mcp-enabled and /api/settings/mcp-limits
     (app/routers/mcp_admin.py). Takes effect immediately. -->
<section class="space-y-3" id="mcp-global-panel">
  <h2 class="text-sm font-semibold text-slate-200">MCP tools</h2>
  <div class="rounded-lg bg-slate-900 border border-slate-800 px-4 py-3 flex items-center justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm text-slate-200">Allow models to use MCP tools</p>
      <p class="text-xs text-slate-500">
        Turn off to stop every chat, for every user, from using tools. The servers themselves are managed in
        Knowledge &rarr; Configure MCP.
      </p>
    </div>
    <label class="relative inline-flex items-center cursor-pointer shrink-0" title="Applies to all users right away.">
      <input type="checkbox" id="mcp-global-enabled" class="peer sr-only">
      <div class="h-6 w-11 rounded-full bg-slate-700 transition-colors peer-checked:bg-brand-600 peer-focus-visible:outline peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-brand-500"></div>
      <div class="absolute left-1 top-1 h-4 w-4 rounded-full bg-white transition-transform peer-checked:translate-x-5"></div>
    </label>
  </div>
  <p id="mcp-global-status" class="text-xs text-slate-500"></p>

  <div id="mcp-limits-panel" class="rounded-lg bg-slate-900 border border-slate-800 px-4 py-3 space-y-3">
    <p class="text-xs text-slate-500">
      Limits for every MCP server, whoever set it up. Lower values make replies faster, especially on CPU.
    </p>
    <div class="grid grid-cols-2 gap-3">
      <label class="block">
        <span class="text-sm text-slate-200">Max tool rounds per reply</span>
        <span class="block text-xs text-slate-500">After this many rounds the model must answer without tools.</span>
        <input type="number" id="mcp-max-rounds" value="5" min="1" max="20" step="1"
          class="mt-1 w-full rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500" />
      </label>
      <label class="block">
        <span class="text-sm text-slate-200">Max tool result characters</span>
        <span class="block text-xs text-slate-500">A longer result is cut before the model reads it (about 4 characters per token).</span>
        <input type="number" id="mcp-max-result-chars" value="4000" min="500" max="20000" step="100"
          class="mt-1 w-full rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500" />
      </label>
    </div>
    <div class="flex items-center gap-3">
      <button id="mcp-limits-save" type="button"
        class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-500 transition-colors">Save</button>
      <span id="mcp-limits-status" class="text-xs text-slate-500"></span>
    </div>
  </div>
</section>
