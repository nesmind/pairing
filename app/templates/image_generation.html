{% extends "base.html" %}
{% block title %}Images — {{ app_name }}{% endblock %}
{% block body %}
<div class="flex h-full flex-col">
  <header class="flex items-center justify-between gap-3 border-b border-slate-800 px-4 py-3">
    <div class="flex items-center gap-3">
      <a href="/" class="rounded-lg p-1.5 hover:bg-slate-800 transition-colors" title="Back to chat">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-sm font-semibold">Image generation</h1>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-500">{{ username }}</span>
      <form method="post" action="/logout" class="flex items-center">
        <button type="submit" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">Log out</button>
      </form>
      <!-- Opens the slide-in account panel — see
           app/static/js/account_panel.js and app/templates/_account_panel.html. -->
      <button id="account-panel-badge" type="button"
        class="h-7 w-7 shrink-0 rounded-full overflow-hidden bg-slate-800 text-xs font-medium text-slate-300 hover:opacity-80 transition-opacity"
        title="{{ username }}"></button>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto">
    <div class="mx-auto max-w-3xl px-4 py-8 space-y-6">
      <div id="comfyui-unavailable" class="hidden text-xs text-warning-400 bg-slate-900 border border-warning-500/50 rounded-lg px-3 py-2">
        System is not configured for images yet, ask your admin.
      </div>

      <section class="space-y-3">
        <div class="rounded-lg bg-slate-900 border border-slate-800 px-4 py-3 flex items-center gap-3">
          <label for="gen-mode" class="text-sm text-slate-300 shrink-0">Mode</label>
          <select id="gen-mode" title="Text to image: draw from the prompt alone. Image to image: start from your own picture and change it according to the prompt."
            class="min-w-0 flex-1 rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
            <option value="text_to_image" selected>Text to image</option>
            <option value="image_to_image">Image to image</option>
          </select>
        </div>
      </section>

      <section class="space-y-3 rounded-lg bg-slate-900 border border-slate-800 px-4 py-4">
        <div id="gen-source-panel" class="hidden space-y-3 rounded-md border border-slate-800 bg-slate-950 px-3 py-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Source image</label>
            <input id="gen-source-file" type="file" accept="image/png,image/jpeg,image/webp"
              title="The picture to start from. Width and height below are set from it (long side up to 512) and the image is resized to them."
              class="block w-full text-xs text-slate-400 file:mr-3 file:rounded-md file:border-0 file:bg-slate-800 file:px-3 file:py-1.5 file:text-xs file:text-slate-200 hover:file:bg-slate-700">
            <img id="gen-source-preview" alt="Source image preview" class="hidden mt-2 max-h-40 rounded-md border border-slate-800">
          </div>
          <div class="max-w-[10rem]" title="How far the result may move away from your picture. Low (0.2-0.4) keeps it almost as is; high (0.8-1) mostly ignores it. Only strength x steps of the steps run, so use 4+ steps.">
            <label class="block text-xs font-medium text-slate-400 mb-1">Strength</label>
            <input id="gen-strength" type="number" value="0.6" min="0.05" max="1" step="0.05"
              class="w-full rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Prompt</label>
          <textarea id="gen-prompt" rows="3" dir="auto" placeholder="A cinematic photo of…"
            class="w-full resize-y rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Negative prompt (optional)</label>
          <textarea id="gen-negative-prompt" rows="2" dir="auto" placeholder="blurry, low quality…"
            class="w-full resize-y rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Diffusion models</label>
          <select id="gen-checkpoint"
            class="w-full rounded-md border border-slate-700 bg-slate-950 px-2.5 py-1.5 text-sm focus:outline-none focus:border-brand-500"></select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3">
          <div title="Image width in pixels.">
            <div class="flex items-center justify-between mb-1">
              <label for="gen-width" class="text-xs font-medium text-slate-400">Width</label>
              <span id="gen-width-value" class="text-[11px] font-mono text-slate-500">512</span>
            </div>
            <input type="range" id="gen-width" data-slider min="64" max="2048" step="64" value="512" class="slim-slider slim-slider-ring block w-full">
          </div>
          <div title="Image height in pixels.">
            <div class="flex items-center justify-between mb-1">
              <label for="gen-height" class="text-xs font-medium text-slate-400">Height</label>
              <span id="gen-height-value" class="text-[11px] font-mono text-slate-500">512</span>
            </div>
            <input type="range" id="gen-height" data-slider min="64" max="2048" step="64" value="512" class="slim-slider slim-slider-ring block w-full">
          </div>
          <div title="Cleanup rounds. More = more detail but proportionally slower. Turbo models need only 1-4.">
            <div class="flex items-center justify-between mb-1">
              <label for="gen-steps" class="text-xs font-medium text-slate-400">Steps</label>
              <span id="gen-steps-value" class="text-[11px] font-mono text-slate-500">1</span>
            </div>
            <input type="range" id="gen-steps" data-slider min="1" max="150" step="1" value="1" class="slim-slider slim-slider-ring block w-full">
          </div>
          <div title="How strictly the image follows the prompt. Above ~1 each step runs twice (slower). Turbo models: use 1.">
            <div class="flex items-center justify-between mb-1">
              <label for="gen-cfg" class="text-xs font-medium text-slate-400">CFG</label>
              <span id="gen-cfg-value" class="text-[11px] font-mono text-slate-500">1</span>
            </div>
            <input type="range" id="gen-cfg" data-slider min="0" max="30" step="0.5" value="1" class="slim-slider slim-slider-ring block w-full">
          </div>
        </div>
        <div class="flex items-center gap-2" title="Starting noise. -1 = random each time; a fixed number repeats the same image for the same settings.">
          <label for="gen-seed" class="text-xs font-medium text-slate-400 shrink-0">Seed</label>
          <input id="gen-seed" type="number" value="-1" placeholder="-1 = random"
            class="w-36 rounded-md border border-slate-700 bg-slate-950 px-2 py-1 text-xs focus:outline-none focus:border-brand-500">
          <button id="gen-seed-random" type="button" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">Random</button>
        </div>
        <div class="flex items-center gap-3 pt-1">
          <button id="gen-generate-btn" type="button"
            class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-500 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
            Generate
          </button>
          <span id="gen-status" class="text-xs text-slate-500"></span>
        </div>
      </section>

      <section class="space-y-3">
        <h2 class="text-sm font-semibold text-slate-200">Your generations</h2>
        <div id="gen-gallery" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
        <p id="gen-gallery-empty" class="hidden text-xs text-slate-500">No generations yet.</p>
      </section>
    </div>
  </div>
</div>

{% include "_account_panel.html" %}

<script src="/static/js/app.js?v={{ static_version }}"></script>
<script src="/static/js/theme.js?v={{ static_version }}"></script>
<script src="/static/js/account_panel.js?v={{ static_version }}"></script>
<script src="/static/js/image_generation_sliders.js?v={{ static_version }}"></script>
<script src="/static/js/image_generation_source.js?v={{ static_version }}"></script>
<script src="/static/js/image_generation_viewer.js?v={{ static_version }}"></script>
<script src="/static/js/image_generation.js?v={{ static_version }}"></script>
{% endblock %}
