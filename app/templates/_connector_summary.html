<!-- Settings > External servers: what a connector engine (Cloudflare, RunPod) looks like when it is picked as the active engine; it has no local form like Ollama/Matricxon. Filled by app/static/js/settings_connector_summary.js from GET /api/connectors/{id}/summary. -->
<section id="connector-summary-panel" class="hidden space-y-3">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <h2 data-field="title" class="text-sm font-semibold text-slate-200"></h2>
    <div class="flex items-center gap-3">
      <button type="button" data-action="refresh" class="text-xs text-slate-400 hover:text-slate-200">Refresh</button>
      <a href="/connectors" class="text-xs text-brand-500 hover:underline">Manage on the Connectors page</a>
    </div>
  </div>
  <p data-field="status" class="text-xs text-slate-500"></p>
  <div data-field="body" class="space-y-3">
    <div data-field="pills" class="flex flex-wrap gap-2"></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="rounded-lg bg-slate-900 border border-slate-800 px-4 py-3">
        <p class="text-xs font-medium text-slate-400 mb-2">Account</p>
        <dl data-field="details" class="space-y-1 text-xs"></dl>
      </div>
      <div class="rounded-lg bg-slate-900 border border-slate-800 px-4 py-3">
        <p class="text-xs font-medium text-slate-400 mb-2">Models</p>
        <div data-field="models" class="flex gap-6"></div>
      </div>
    </div>
    <div data-field="usage" class="hidden rounded-lg bg-slate-900 border border-slate-800 px-4 py-3 space-y-3">
      <p data-field="usage-title" class="text-xs font-medium text-slate-400"></p>
      <div data-field="usage-tiles" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
      <div data-field="top-models" class="space-y-1 text-xs"></div>
    </div>
    <p data-field="usage-note" class="hidden text-xs text-slate-500 rounded-lg border border-slate-800 px-3 py-2"></p>
  </div>
</section>
