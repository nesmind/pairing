[alembic]
script_location = alembic

# Timestamp-prefixed filenames make `ls alembic/versions` read in
# chronological order without having to open each file first.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# No sqlalchemy.url here on purpose: app/config.py is this project's one
# place that resolves DATABASE_URL (env var, with the sqlite fallback),
# and alembic/env.py reads it from there instead of duplicating that
# logic in a second config file that could drift out of sync with it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
